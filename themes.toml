[project]
name = "ChromiumColor"
version = "2.0.0"
default_theme = "zen-dark"

# Browser UI themes. Folder/tab-group colors are deliberately not defined here: a build can pair
# any theme below with any independent folder_colors palette.

[themes.gruvbox]
name = "Gruvbox Dark Hard"
description = "A warm Chromium theme based on the Gruvbox Dark Hard palette."
mode = "dark"
frame = "#1d2021"
toolbar = "#282828"
foreground = "#ebdbb2"
muted = "#a89984"
accent = "#d79921"
default_folder_color = "gold"

[themes.black-metal]
name = "Black Metal"
description = "A stark, near-monochrome Chromium theme based on the Black Metal palette."
mode = "dark"
frame = "#000000"
toolbar = "#111111"
foreground = "#c1c1c1"
muted = "#888888"
accent = "#888888"
default_folder_color = "steel"

[themes.iceberg-dark]
name = "Iceberg Dark"
description = "A cool blue Chromium theme based on the Iceberg dark palette."
mode = "dark"
frame = "#161821"
toolbar = "#1e2132"
foreground = "#c6c8d1"
muted = "#6b7089"
accent = "#84a0c6"
default_folder_color = "ice"

[themes.rose-pine]
name = "Rose Pine"
description = "A muted, elegant Chromium theme based on the Rose Pine palette."
mode = "dark"
frame = "#191724"
toolbar = "#1f1d2e"
foreground = "#e0def4"
muted = "#908caa"
accent = "#9ccfd8"
default_folder_color = "rose"

# The Zen palettes use Suda's canvas and foreground as anchors. Chromium-specific surfaces and the
# light-mode accent are adjusted around them for clear browser chrome.
[themes.zen-dark]
name = "Zen Dark"
description = "A calm dark Chromium theme inspired by Suda's Zen dark palette."
mode = "dark"
frame = "#19191b"
toolbar = "#28282a"
foreground = "#f5f5f4"
muted = "#a1a1aa"
accent = "#6ced96"
default_folder_color = "mint"

[themes.zen-light]
name = "Zen Light"
description = "A calm light Chromium theme inspired by Suda's Zen light palette."
mode = "light"
frame = "#f4f1ed"
toolbar = "#e6e3df"
foreground = "#27272a"
muted = "#71717a"
accent = "#2d633f"
default_folder_color = "mint"

# Folder colors affect only theme.tab_group_color_palette. Chromium interprets these integers as
# hue angles for its nine built-in tab-group color slots, in the order documented by `slots`.

[folder_colors.gold]
name = "Gold"
description = "Warm gold and amber hues; the natural Gruvbox companion."
base_color = "#d79921"
slots = ["grey", "blue", "red", "yellow", "green", "pink", "purple", "cyan", "orange"]
hues = [10, 18, 26, 34, 42, 50, 58, 66, 74]

[folder_colors.red]
name = "Red"
description = "A red-to-orange tab-group range."
base_color = "#cc241d"
slots = ["grey", "blue", "red", "yellow", "green", "pink", "purple", "cyan", "orange"]
hues = [330, 338, 346, 354, 2, 10, 18, 26, 34]

[folder_colors.green]
name = "Green"
description = "The original Gruvbox green tab-group range."
base_color = "#98971a"
slots = ["grey", "blue", "red", "yellow", "green", "pink", "purple", "cyan", "orange"]
hues = [28, 36, 44, 52, 60, 68, 76, 84, 92]

