[themes.zen-light]
name = "Zen Light"
description = "A calm light Chromium theme inspired by Suda's Zen light palette."
mode = "light"
default_accent_color = "pistachio"

[themes.zen-light.colors]
frame = "#f4f1ed"
frame_inactive = "#f4f1ed"
bookmark_text = "#27272a"
button_background = "#f4f1ed"
tab_background_text = "#71717a"
tab_background_text_inactive = "#71717a"
tab_text = "#27272a"
toolbar = "#e6e3df"
toolbar_button_icon = "#27272a"
toolbar_text = "#27272a"
frame_incognito = "#f4f1ed"
