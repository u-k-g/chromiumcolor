# Accent colors set theme.tab_group_color_palette plus `omnibox_text` and `ntp_link`. Chromium
# interprets these integers as hue angles for its nine tab-group slots in the order documented by
# `slots`; the palette midpoint becomes both accent colors.

[accent_colors.carnation]
name = "Carnation"
description = "A soft pink range centered at 0 degrees."
slots = ["blue", "purple", "pink", "red", "orange", "yellow", "green", "cyan", "grey"]
hues = [332, 339, 346, 353, 0, 7, 14, 21, 28]

[accent_colors.flamingo]
name = "Flamingo"
description = "A warm pink range centered at 10 degrees."
slots = ["blue", "purple", "pink", "red", "orange", "yellow", "green", "cyan", "grey"]
hues = [342, 349, 356, 3, 10, 17, 24, 31, 38]

