[project]
name = "ChromiumColor"
version = "2.0.0"
default_theme = "zen-dark"

# Every browser UI color is explicit so each theme can tune Chromium surfaces independently.
# `omnibox_text` and `ntp_link` define one authored accent and must match. At build time the chosen
# accent palette replaces both with its calculated midpoint, keeping the browser accent in sync.

[themes.gruvbox]
name = "Gruvbox Dark Hard"
description = "A warm Chromium theme based on the Gruvbox Dark Hard palette."
mode = "dark"
default_accent_color = "lime"

[themes.gruvbox.colors]
frame = "#1d2021"
frame_inactive = "#1d2021"
bookmark_text = "#ebdbb2"
button_background = "#1d2021"
tab_background_text = "#a89984"
tab_background_text_inactive = "#a89984"
tab_text = "#ebdbb2"
toolbar = "#282828"
toolbar_button_icon = "#ebdbb2"
toolbar_text = "#ebdbb2"
frame_incognito = "#1d2021"
frame_incognito_inactive = "#1d2021"
tab_background_text_incognito = "#ebdbb2"
tab_background_text_incognito_inactive = "#a89984"
omnibox_text = "#d79921"
omnibox_background = "#1d2021"
ntp_background = "#1d2021"
ntp_header = "#282828"
ntp_link = "#d79921"
ntp_text = "#a89984"

[themes.black-metal]
name = "Black Metal"
description = "A stark, near-monochrome Chromium theme based on the Black Metal palette."
mode = "dark"

[themes.black-metal.colors]
frame = "#000000"
frame_inactive = "#000000"
bookmark_text = "#c1c1c1"
button_background = "#000000"
tab_background_text = "#888888"
tab_background_text_inactive = "#888888"
tab_text = "#c1c1c1"
toolbar = "#111111"
toolbar_button_icon = "#c1c1c1"
toolbar_text = "#c1c1c1"
frame_incognito = "#000000"
frame_incognito_inactive = "#000000"
tab_background_text_incognito = "#c1c1c1"
tab_background_text_incognito_inactive = "#888888"
omnibox_text = "#a06666"
omnibox_background = "#000000"
ntp_background = "#000000"
ntp_header = "#111111"
ntp_link = "#a06666"
ntp_text = "#888888"

[themes.iceberg-dark]
name = "Iceberg Dark"
description = "A cool blue Chromium theme based on the Iceberg dark palette."
mode = "dark"

[themes.iceberg-dark.colors]
frame = "#161821"
frame_inactive = "#161821"
bookmark_text = "#c6c8d1"
button_background = "#161821"
tab_background_text = "#6b7089"
tab_background_text_inactive = "#6b7089"
tab_text = "#c6c8d1"
toolbar = "#1e2132"
toolbar_button_icon = "#c6c8d1"
toolbar_text = "#c6c8d1"
frame_incognito = "#161821"
frame_incognito_inactive = "#161821"
tab_background_text_incognito = "#c6c8d1"
tab_background_text_incognito_inactive = "#6b7089"
omnibox_text = "#84a0c6"
omnibox_background = "#161821"
ntp_background = "#161821"
ntp_header = "#1e2132"
ntp_link = "#84a0c6"
ntp_text = "#6b7089"

[themes.rose-pine]
name = "Rosé Pine"
description = "A muted, elegant Chromium theme based on the official Rosé Pine Chrome theme."
mode = "dark"
default_accent_color = "iris"

# Browser surfaces follow the official Rosé Pine Chrome manifest; its authored accent is normalized
# across `omnibox_text` and `ntp_link` so accent palettes can replace them together.
# https://github.com/rose-pine/google-chrome/blob/main/rose-pine/manifest.json
[themes.rose-pine.colors]
frame = "#191724"
frame_inactive = "#191724"
bookmark_text = "#e0def4"
button_background = "#191724"
tab_background_text = "#908caa"
tab_background_text_inactive = "#6e6a86"
tab_text = "#e0def4"
toolbar = "#1f1d2e"
toolbar_button_icon = "#e0def4"
toolbar_text = "#e0def4"
frame_incognito = "#403d52"
frame_incognito_inactive = "#403d52"
tab_background_text_incognito = "#e0def4"
tab_background_text_incognito_inactive = "#908caa"
omnibox_text = "#ebbcba"
omnibox_background = "#191724"
ntp_background = "#191724"
ntp_header = "#1f1d2e"
ntp_link = "#ebbcba"
ntp_text = "#908caa"

[themes.rose-pine.properties]
ntp_background_alignment = "bottom"
ntp_logo_alternate = 1

[themes.rose-pine-dawn]
name = "Rosé Pine Dawn"
description = "A warm light Chromium theme based on the official Rosé Pine Dawn Chrome theme."
mode = "light"
default_accent_color = "iris"

# Values and solid swatches mirror the upstream Rosé Pine Dawn Chrome theme. Its Pine omnibox color
# is used as the authored accent for automatic defaults and accent-palette replacement.
# https://github.com/rose-pine/google-chrome/blob/main/rose-pine-dawn/manifest.json
[themes.rose-pine-dawn.colors]
frame = "#f2e9e1"
frame_inactive = "#f2e9e1"
bookmark_text = "#575279"
button_background = "#faf4ed"
tab_background_text = "#797593"
tab_background_text_inactive = "#9893a5"
tab_text = "#575279"
toolbar = "#fffaf3"
toolbar_button_icon = "#575279"
toolbar_text = "#575279"
frame_incognito = "#dfdad9"
frame_incognito_inactive = "#dfdad9"
tab_background_text_incognito = "#575279"
tab_background_text_incognito_inactive = "#797593"
omnibox_text = "#286983"
omnibox_background = "#faf4ed"
ntp_background = "#faf4ed"
ntp_header = "#fffaf3"
ntp_link = "#286983"
ntp_text = "#797593"

[themes.rose-pine-dawn.properties]
ntp_background_alignment = "bottom"
ntp_logo_alternate = 1

# The Zen palettes use Suda's canvas and foreground as anchors. Chromium-specific surfaces and the
# light-mode accent are adjusted around them for clear browser chrome.
[themes.zen-dark]
name = "Zen Dark"
description = "A calm dark Chromium theme inspired by Suda's Zen dark palette."
mode = "dark"
default_accent_color = "pistachio"

[themes.zen-dark.colors]
